services:
  - type: web
    name: rainbet-blackjack-advisor
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PLAUSIBLE_STATS_API_KEY
        sync: false
      - key: PLAUSIBLE_SITE_ID
        sync: false
      - key: SITE_STATS_ADMIN_EMAILS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_TRIAL_PRICE_ID
        sync: false
      - key: STRIPE_MONTHLY_PRICE_ID
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: SPONSOR_CODE
        value: SPONSORSCODE
